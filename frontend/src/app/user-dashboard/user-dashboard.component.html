<div class="min-h-screen bg-gray-50 pb-20">

  <div class="navbar bg-base-100 shadow-sm border-b px-8 py-3 sticky top-0 z-50">
    <div class="flex-1">
      <a class="text-2xl font-bold tracking-tight text-primary">SWTechLabs</a>
    </div>
    <div class="flex-none gap-4">
      <span class="text-sm font-medium text-neutral/70">Welcome, {{username}}</span>
      <button class="btn btn-ghost btn-circle hover:bg-red-50 hover:text-red-500 transition-colors" (click)="logout()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
      </button>
    </div>
  </div>


  <div class="toast toast-top toast-center z-50" *ngIf="bookingMessage" @messageFade>
    <div class="alert" [ngClass]="bookingSuccess ? 'alert-success' : 'alert-error'">
      <span class="text-white font-medium">{{bookingMessage}}</span>
    </div>
  </div>

  <div class="max-w-6xl mx-auto px-4 mt-12">
    <div class="mb-10 text-center space-y-3">
      <h1 class="text-4xl font-extrabold tracking-tight text-neutral">Explore Our curated collection</h1>
      <p class="text-neutral/60 max-w-2xl mx-auto text-lg">Select a date and reserve your stay in one of our luxurious accommodations. Designed for comfort and elegance.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10" [@listAnimation]="hotels.length">

      <div *ngFor="let hotel of hotels" class="card bg-base-100 shadow-xl rounded-[2rem] overflow-hidden hover:shadow-2xl transition-all duration-500 group border border-base-200">
        <figure class="relative h-64 overflow-hidden">
          <img [src]="hotel.image" [alt]="hotel.name" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 ease-out" />
          <div class="absolute top-4 right-4 bg-white/90 backdrop-blur-sm px-4 py-2 rounded-full font-bold text-primary shadow-sm">
            ${{hotel.price}}<span class="text-xs text-neutral/60 font-normal">/night</span>
          </div>
        </figure>
        
        <div class="card-body p-6">
          <h2 class="card-title text-xl font-bold mb-4">{{hotel.name}}</h2>
          
          <div class="space-y-2 mb-4">
             <label class="text-xs font-semibold text-neutral/50 uppercase tracking-wider">Select Available Date (Upcoming Week)</label>
             <div class="flex gap-2 overflow-x-auto pb-2 custom-scrollbar">
                <button 
                  *ngFor="let wd of weekDates"
                  class="btn btn-sm rounded-xl flex-shrink-0 transition-all font-medium"
                  [ngClass]="{
                    'btn-disabled opacity-50 bg-base-200 text-neutral/40 border-none': isBooked(hotel, wd.dateString),
                    'btn-primary shadow-md scale-105': hotel.selectedDate === wd.dateString,
                    'btn-outline btn-primary hover:bg-primary/10 border-primary/20': hotel.selectedDate !== wd.dateString && !isBooked(hotel, wd.dateString)
                  }"
                  (click)="selectDate(hotel, wd.dateString)"
                  [disabled]="isBooked(hotel, wd.dateString)">
                  {{wd.display}}
                </button>
             </div>
          </div>

          <div class="card-actions mt-auto pt-4 border-t border-base-200">
            <button class="btn btn-primary w-full rounded-2xl shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all duration-300"
              [disabled]="!hotel.selectedDate"
              (click)="book(hotel)">
              {{ !hotel.selectedDate ? 'Please Select Date' : 'Book It' }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
